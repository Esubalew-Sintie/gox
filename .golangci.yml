# golangci-lint v2 configuration for the gox repository itself.
# Generated projects get their own file with the depguard dependency rule (docs/plan.md, section 3.1).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint       # wrap with %w, compare with errors.Is/As
    - gocritic
    - misspell
    - nolintlint      # every nolint directive names a linter and a reason
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks: [hugeParam]   # options structs are passed by value on purpose
    revive:
      rules:
        - name: exported
          disabled: true
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003"]
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/esubalew-Sintie/gox]
